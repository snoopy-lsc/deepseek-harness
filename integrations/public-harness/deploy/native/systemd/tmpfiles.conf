# /etc/tmpfiles.d/dsh-public.conf — native runtime and state directories with their owners and modes.
d /run/dsh-public                    0755 root         root
d /run/dsh-public/router             0750 dsh-router   dsh-ingress
d /run/dsh-public/router-private     0700 dsh-router   dsh-router
# Caddy reaches the identity service's public socket; only the router reaches the session socket.
d /run/dsh-public/identity           0750 dsh-identity dsh-ingress
d /run/dsh-public/identity-session   0750 dsh-identity dsh-router
d /run/dsh-public/control            0750 root         dsh-router
d /run/dsh-public/admin              0700 root         root
d /run/dsh-public/instances          0750 root         dsh-router
d /var/lib/dsh-public                0755 root         root
d /var/lib/dsh-public/profiles       0700 root         root
d /var/lib/dsh-public/state          0700 root         root
# Tenant storage lives on the XFS filesystem mounted at /srv/dsh-public with user quotas enforced.
d /srv/dsh-public/storage            0711 root         root
d /etc/dsh-public                    0755 root         root
d /etc/dsh-public/secrets            0750 root         dsh-quota
d /etc/dsh-public/identity-secrets   0700 dsh-identity dsh-identity
