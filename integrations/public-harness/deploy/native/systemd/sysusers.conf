# /etc/sysusers.d/dsh-public.conf — native service accounts; per-user tenant accounts are created by the provisioner.
u dsh-identity - "Native Harness identity" /var/empty /usr/sbin/nologin
u dsh-router   - "Native Harness router" /var/empty /usr/sbin/nologin
u dsh-quota    - "Native Harness quota proxy" /var/empty /usr/sbin/nologin
u dsh-kb       - "Native Harness knowledge base" /var/empty /usr/sbin/nologin
g dsh-ingress -
m caddy dsh-ingress
m dsh-router dsh-ingress
# Knowledge base: identity reaches the kb socket (dsh-kb-clients); dsh-kb reaches the quota job socket (dsh-kb-quota).
# The dsh-kb group itself (KB root, root helper socket) has no other member.
g dsh-kb-clients -
m dsh-kb dsh-kb-clients
m dsh-identity dsh-kb-clients
g dsh-kb-quota -
m dsh-kb dsh-kb-quota
m dsh-quota dsh-kb-quota

# Plugin market: catalogue (dsh-plugins), fetch (dsh-plugins-fetch), egress proxy (dsh-plugins-egress).
# dsh-plugins group owns /var/lib/dsh-plugins and the fetch socket; only dsh-plugins is a member.
# dsh-plugins-clients: identity reaches the control socket; provisioner runs as root.
u dsh-plugins - "Native Harness plugin market" /var/empty /usr/sbin/nologin
u dsh-plugins-fetch - "Native Harness plugin fetch" /var/empty /usr/sbin/nologin
u dsh-plugins-egress - "Native Harness plugin egress" /var/empty /usr/sbin/nologin
g dsh-plugins-clients -
m dsh-identity dsh-plugins-clients
