# /etc/sysusers.d/dsh-public.conf — service accounts and groups; per-user instance accounts are created by the provisioner.
u dsh-router - "Team Harness router" /var/empty /usr/sbin/nologin
u dsh-quota  - "Team Harness quota proxy" /var/empty /usr/sbin/nologin
g dsh-ingress -
g dsh-instances -
m caddy dsh-ingress
m dsh-router dsh-ingress
# Exempt from hidepid on /proc: systemd-logind (drop-in) and monitoring accounts. Never add an instance account.
g dsh-procview -
