# /etc/systemd/system/caddy.service.d/dsh-public.conf
[Service]
EnvironmentFile=/etc/dsh-public/caddy.env
# Directory of the admin socket (Unix only; there is no TCP admin endpoint).
RuntimeDirectory=caddy
RuntimeDirectoryMode=0750
# Caddy may reach the router socket (group dsh-router-ingress) and nothing else under /run/dsh-public.
SupplementaryGroups=dsh-ingress
ReadOnlyPaths=/run/dsh-public/router
